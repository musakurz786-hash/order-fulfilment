<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Fulfilment</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div id="loginView" class="login" hidden>
  <h1>Order Fulfilment</h1>
  <p class="muted">Sign in with your work email.</p>
  <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
    <label>Email<input class="input" id="loginEmail" type="email" autocomplete="username" required></label>
    <label>Password<input class="input" id="loginPass" type="password" autocomplete="current-password" required></label>
    <button class="btn gold" type="submit">Sign in</button>
  </form>
  <div id="loginMsg" class="banner err" hidden></div>
</div>

<div id="appView" hidden>
  <header class="top">
    <div class="brand">Order Fulfilment</div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="who"><span id="whoEmail"></span><span class="role" id="whoRole"></span><button class="btn sm ghost" id="changePw">Change password</button><button class="btn sm ghost" id="signOut">Sign out</button></div>
  </header>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const supa = window.supabase.createClient(CONFIG.SB_URL, CONFIG.SB_KEY);

// ---------- state ----------
const S = {
  role: null, email: '', userId: null,
  view: 'board', query: '', boardFilter: 'open', lookupOpenOnly: false,
  locations: [], locByName: {}, orders: {}, lines: [], attempts: [], events: [], stock: {}, adjustments: [],
  loadedAt: null, syncMsg: null,
};
const isAdmin = () => S.role === 'admin';
// Customer support can draft store emails and mark them sent (when the admin can't); everything else stays admin-only
const canEmail = () => isAdmin() || S.role === 'cs';
const ADMIN_EMAIL = 'musa@freedomofmovement.co.za';
const nameOf = email => { const n = String(email || '').split('@')[0]; return n ? n[0].toUpperCase() + n.slice(1) : ''; };
const signOff = () => isAdmin() ? CONFIG.SIGN_OFF : nameOf(S.email);
// "by Lariska" next to an email someone else sent
const byText = who => who && who.toLowerCase() !== String(S.email).toLowerCase() ? ` · ${nameOf(who)}` : '';
const sentBy = who => who ? ` by ${nameOf(who)}` : '';
const PROV_NEAR = {
  WC:['WC','EC','NC','FS','NW','GP','NL','MP','LP'], EC:['EC','WC','NL','FS','NC','GP','NW','MP','LP'],
  NC:['NC','FS','WC','NW','EC','GP','NL','MP','LP'], FS:['FS','NC','NW','GP','NL','EC','WC','MP','LP'],
  NW:['NW','GP','FS','NC','LP','MP','NL','EC','WC'], GP:['GP','NW','MP','FS','LP','NL','NC','EC','WC'],
  NL:['NL','MP','FS','GP','EC','NW','LP','NC','WC'], MP:['MP','GP','LP','NL','NW','FS','NC','EC','WC'],
  LP:['LP','GP','MP','NW','NL','FS','NC','EC','WC'],
};
const STATUS_LABEL = { wait:'Waiting', ok:'Has stock', bad:'No stock', hold:'On hold', sent:'Collected', released:'Released', noreply:'No reply' };

// ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-ZA', { day:'numeric', month:'short' }) + ' ' + d.toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit' });
}
function toast(msg) {
  const t = h('div', { class:'toast', role:'status' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
const short = name => (S.locByName[name]?.short_name) || String(name || '').replace(/^FOM\s+/, '');
const normOrder = s => { const t = String(s || '').trim().toUpperCase().replace(/\s+/g, '').replace(/^#/, ''); return t ? (t.startsWith('FOM') ? t : 'FOM' + t) : ''; };
const avail = (sku, loc) => S.stock[sku]?.[loc] ?? 0;
const hqLoc = () => S.locations.find(l => l.is_hq)?.name || 'FOM Online';

// ---------- derived line status ----------
function attemptsFor(line) { return S.attempts.filter(a => a.line_id === line.id).sort((a, b) => b.created_at.localeCompare(a.created_at)); }
function stageOf(line) {
  const att = attemptsFor(line)[0] || null;
  if (line.state === 'refund') return { key:'refund', label:'Refund', att };
  if (line.state === 'cancelled') return { key:'cancelled', label:'Cancelled', att };
  if (line.state === 'hq_found') return { key:'hq', label:'Found at HQ', att };
  if (line.hq_check === 'pending' && !att) return { key:'hq_check', label:'Warehouse rechecking', att };
  if (!att) return { key:'new', label:'Needs a store', att };
  if (att.status === 'bad' || att.status === 'noreply') return { key:'bad', label: att.status === 'noreply' ? 'No reply – find another store' : 'No stock – find another store', att };
  if (att.status === 'wait') return { key:'wait', label: att.stock_mail_at ? 'Waiting for store' : 'Stock check to send', att };
  if (att.status === 'ok') return { key:'ok', label: att.collect_mail_at ? 'Awaiting Aramex' : 'Store has it – book collection', att };
  if (att.status === 'hold') return { key:'hold', label:'On hold', att };
  return { key:'sent', label:'Collected', att };
}
function sayFor(line, st) {
  const s = st.att ? short(st.att.location_name) : '';
  switch (st.key) {
    case 'refund': return line.shopify_current === 0 ? 'No store could supply this item. It has been refunded in Shopify.' : 'No store can supply this item. It will be refunded.';
    case 'cancelled': return 'Item cancelled.';
    case 'hq': return 'The warehouse found it. It ships from HQ.';
    case 'hq_check': return `The warehouse system shows ${avail(line.sku, hqLoc())} at HQ. The warehouse is checking again.`;
    case 'new': return 'Being sourced. A store has not been asked yet.';
    case 'bad': return st.att.status === 'noreply' ? `${s} didn't reply. We're asking another store.` : `${s} doesn't have it. We're asking another store.`;
    case 'wait': return st.att.stock_mail_at ? `Stock check sent to ${s}. Waiting for the store to reply.` : `${s} will be asked to check stock.`;
    case 'ok': return st.att.collect_mail_at || st.att.collection_ref
      ? `${s} has it set aside. Aramex collection has been requested${hasWaybill(st.att) ? ` (waybill ${st.att.waybill_number})` : ''}.`
      : `${s} has it set aside. Collection still to be booked.`;
    case 'hold': return `On hold at ${s}. Waiting on a decision from the DC.`;
    default: {
      const a = st.att;
      if (a?.delivered_at) return `Delivered to the customer by Aramex on ${when(a.delivered_at)} (waybill ${a.waybill_number}).`;
      return `Collected by Aramex from ${s}.` + (hasWaybill(a) ? ` Waybill ${a.waybill_number}${a.aramex_status ? ` – latest: ${a.aramex_status}` : ''}.` : '');
    }
  }
}
const isOpenStage = k => !['sent','hq','refund','cancelled'].includes(k);

// ---------- store suggestion ----------
// Closest stores with stock for one item, by real straight-line distance to the customer when both positions are
// known; otherwise same town, then same province, then neighbouring provinces. A store that can also supply the
// order's other items wins if it's within ~30 km of the closest (so the order ships as one parcel).
// stockOf(sku, location) lets the Add-short-pick preview rank stores before anything is saved.
const NUDGE_KM = 30;
function km(a, b) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function rankStores({ sku, qty, order, siblings = [], exclude = new Set(), stockOf = avail, limit = 4 }) {
  const near = PROV_NEAR[order.province_code] || PROV_NEAR.WC;
  const city = String(order.city || '').toLowerCase().trim();
  const hasPos = order.lat != null && order.lng != null;
  return S.locations.filter(l => l.sourceable && !l.is_hq && !exclude.has(l.name) && stockOf(sku, l.name) >= qty).map(l => {
    const covers = siblings.filter(s => stockOf(s.sku, l.name) >= s.qty).length;
    const dist = hasPos && l.lat != null ? km(order, l) : null;
    let score;
    if (dist != null) score = dist - covers * NUDGE_KM;
    else {   // fallback: province order, expressed in "km" so it sorts after any store with a real distance
      score = (near.indexOf(l.province_code) < 0 ? 9 : near.indexOf(l.province_code)) * 500 + 5000;
      if (city && l.city && l.city.toLowerCase() === city) score -= 250;
      score -= covers * 150;
    }
    return { loc: l, score, qty: stockOf(sku, l.name), covers, km: dist };
  }).sort((a, b) => a.score - b.score || b.qty - a.qty).slice(0, limit);
}
const kmLabel = s => s.km == null ? '' : s.km < 10 ? `${s.km.toFixed(1)} km` : `${Math.round(s.km)} km`;
function suggestStores(line, limit = 4) {
  // Other open items on the same order still needing a store: prefer a store that can do them all
  const siblings = S.lines.filter(l => l.order_name === line.order_name && l.id !== line.id && ['new','bad'].includes(stageOf(l).key));
  return rankStores({ sku: line.sku, qty: line.qty, order: S.orders[line.order_name] || {}, siblings,
    exclude: new Set(attemptsFor(line).map(a => a.location_name)), limit });
}

// ---------- data ----------
async function loadAll() {
  const since = new Date(Date.now() - CONFIG.LOOKBACK_DAYS * 864e5).toISOString();
  const [loc, lines, adj, sync, flags, scan] = await Promise.all([
    supa.from('ful_locations').select('*').order('sort').order('name'),
    supa.from('ful_lines').select('*').gte('added_at', since).order('added_at', { ascending:false }).limit(2000),
    supa.from('ful_hq_adjustments').select('*').order('reported_at', { ascending:false }).limit(500),
    supa.from('ful_sync_log').select('*').order('at', { ascending:false }).limit(1),
    supa.from('ful_mail_log').select('*').eq('outcome', 'flagged').is('reviewed_at', null).order('received_at', { ascending:false }).limit(50),
    supa.from('ful_mail_log').select('scanned_at').order('scanned_at', { ascending:false }).limit(1),
  ]);
  for (const r of [loc, lines, adj, sync, flags, scan]) if (r.error) throw r.error;
  S.lastSync = sync.data[0] || null;
  S.mailFlags = flags.data;
  S.lastScan = scan.data[0]?.scanned_at || null;
  S.locations = loc.data; S.locByName = Object.fromEntries(loc.data.map(l => [l.name, l]));
  S.lines = lines.data; S.adjustments = adj.data;
  const ids = S.lines.map(l => l.id);
  const orderNames = [...new Set(S.lines.map(l => l.order_name))];
  const skus = [...new Set(S.lines.map(l => l.sku))];
  const chunks = (a, n) => Array.from({ length: Math.ceil(a.length / n) }, (_, i) => a.slice(i * n, i * n + n));
  const att = [], ord = [], st = [], ev = [], notes = [];
  for (const c of chunks(ids, 200)) {
    const [a, e] = await Promise.all([
      supa.from('ful_attempts').select('*').in('line_id', c),
      supa.from('ful_events').select('*').in('line_id', c).order('at'),
    ]);
    if (a.error) throw a.error; if (e.error) throw e.error;
    att.push(...a.data); ev.push(...e.data);
  }
  for (const c of chunks(orderNames, 200)) { const r = await supa.from('ful_orders').select('*').in('order_name', c); if (r.error) throw r.error; ord.push(...r.data); }
  for (const c of chunks(orderNames, 200)) { const r = await supa.from('ful_order_notes').select('*').in('order_name', c).order('created_at'); if (r.error) throw r.error; notes.push(...r.data); }
  for (const c of chunks(skus, 100)) { const r = await supa.from('ful_stock').select('sku,location_name,available,synced_at').in('sku', c).limit(10000); if (r.error) throw r.error; st.push(...r.data); }
  S.attempts = att; S.events = ev;
  S.notes = {}; for (const n of notes) (S.notes[n.order_name] ||= []).push(n);
  S.orders = Object.fromEntries(ord.map(o => [o.order_name, o]));
  S.stock = {}; S.stockAt = {};
  for (const r of st) { (S.stock[r.sku] ||= {})[r.location_name] = r.available; if (!S.stockAt[r.sku] || r.synced_at > S.stockAt[r.sku]) S.stockAt[r.sku] = r.synced_at; }
  S.loadedAt = new Date().toISOString();
}

async function act(fn, okMsg) {
  try { await fn(); await loadAll(); render(); if (okMsg) toast(okMsg); }
  catch (e) { console.error(e); toast('Didn’t save: ' + (e.message || e)); }
}
const logEvent = (line, kind, detail) => supa.from('ful_events').insert({ line_id: line.id, order_name: line.order_name, kind, detail });

async function assignStore(line, locName) {
  await act(async () => {
    const r = await supa.from('ful_attempts').insert({ line_id: line.id, location_name: locName, status: 'wait' });
    if (r.error) throw r.error;
    await logEvent(line, 'store_assigned', short(locName));
  }, `${line.order_name} → ${short(locName)}`);
}
async function setAttemptStatus(line, att, v) {
  if (att.status === v) return;
  const patch = { status: v };
  if (['ok','bad','hold'].includes(v) && !att.replied_at) patch.replied_at = new Date().toISOString();
  if (v === 'sent') patch.collected_at = new Date().toISOString();
  await act(async () => {
    const r = await supa.from('ful_attempts').update(patch).eq('id', att.id);
    if (r.error) throw r.error;
    await logEvent(line, 'status', `${short(att.location_name)}: ${STATUS_LABEL[v]}`);
  });
  // Store has no stock: offer the next closest stores straight away
  if (v === 'bad' && isAdmin()) openNextStore(line.id, att.location_name);
}

// "No stock" chooser: next closest stores with stock (stores already asked are left out). Picking one creates the
// new store request, so the item lands in "Stock check to send" for that store.
function openNextStore(lineId, fromLoc, why = 'No stock at') {
  const line = S.lines.find(l => l.id === lineId);
  if (!line) return;
  closeModal();
  const sug = suggestStores(line, 6);
  const pick = async name => { closeModal(); await assignStore(line, name); S.cat = 'to_check'; render(); };
  const body = sug.length
    ? h('div', { class:'pick-list' }, ...sug.map((s, i) => h('button', { class:'store-choice' + (i === 0 ? ' best' : ''), onclick: () => pick(s.loc.name) },
        h('span', { class:'item-name' }, (i === 0 ? '★ ' : '') + s.loc.short_name),
        h('span', { class:'muted sm' }, [`${s.qty} in stock`, kmLabel(s), s.covers ? `has ${s.covers} other item${s.covers === 1 ? '' : 's'} on this order` : ''].filter(Boolean).join(' · ')))))
    : h('div', { class:'banner' }, 'No other store has stock of this item.');
  const bg = h('div', { class:'modal-bg', onclick: e => { if (e.target === bg) closeModal(); } },
    h('div', { class:'modal', role:'dialog', 'aria-modal':'true', 'aria-label':'Ask another store' },
      h('div', { class:'modal-head' }, h('div', { class:'card-title' }, `${why} ${short(fromLoc)}`), h('span', { class:'muted' }, line.order_name),
        h('button', { class:'btn sm ghost', style:'margin-left:auto', onclick: closeModal }, 'Close')),
      h('div', { class:'modal-body' },
        h('div', { class:'item-name' }, line.item_name), h('div', { class:'meta' }, `${line.sku} · qty ${line.qty}`),
        h('div', { class:'section-title' }, sug.length ? 'Ask another store' : 'What next?'), body),
      h('div', { class:'modal-foot' },
        h('button', { class:'btn ghost', onclick: () => { closeModal(); openFoundAtHq(line); } }, 'Found at HQ'),
        h('button', { class:'btn ghost', onclick: () => { closeModal(); if (confirm(`Mark ${line.order_name} – ${line.item_name} for refund?`)) setLine(line, { state:'refund' }, 'refund', 'Marked for refund'); } }, 'Mark for refund'),
        h('button', { class:'btn', onclick: closeModal }, 'Not now'))));
  document.getElementById('modalRoot').append(bg);
}

// The store never replied: close its request as "No reply" (every item of the order still waiting on it) and
// offer the next closest store, like "No stock".
async function moveOnFromStore(line) {
  const att = attemptsFor(line)[0];
  if (!att || att.status !== 'wait') return;
  const same = S.lines.filter(l => l.order_name === line.order_name && l.state === 'open')
    .map(l => ({ line: l, att: attemptsFor(l)[0] })).filter(p => p.att && p.att.status === 'wait' && p.att.location_name === att.location_name);
  if (!confirm(`${short(att.location_name)} hasn't replied. Stop waiting for them and ask another store for ${same.length > 1 ? `these ${same.length} items` : 'this item'}?`)) return;
  await act(async () => {
    const r = await supa.from('ful_attempts').update({ status: 'noreply' }).in('id', same.map(p => p.att.id));
    if (r.error) throw r.error;
    for (const p of same) await logEvent(p.line, 'status', `${short(att.location_name)}: No reply – asking another store`);
  });
  if (same.length === 1) openNextStore(line.id, att.location_name, 'No reply from');
  else { S.cat = 'need'; render(); toast(`${same.length} items moved to Needs a store`); }
}

// Whole order vs split shipment: does this store's share cover every item still on the Shopify order?
function shipmentOf(line, loc) {
  const total = S.orders[line.order_name]?.item_count;
  if (!loc || total == null) return null;
  const here = S.lines.filter(l => l.order_name === line.order_name && l.state === 'open').reduce((n, l) => {
    const a = attemptsFor(l)[0];
    return a && a.location_name === loc && !['bad','released','noreply'].includes(a.status) ? n + l.qty : n;
  }, 0);
  const fromStore = Math.max(here, line.qty);
  return { total, here: fromStore, split: total > fromStore };
}
const ageHours = iso => iso ? (Date.now() - new Date(iso)) / 36e5 : 0;
function ageText(iso) {
  const hrs = ageHours(iso);
  if (hrs < 1) return `${Math.max(1, Math.round(hrs * 60))} min`;
  if (hrs < 24) return `${Math.round(hrs)} h`;
  const d = Math.floor(hrs / 24);
  return `${d} day${d === 1 ? '' : 's'}`;
}
function shipTag(line, loc) {
  const s = shipmentOf(line, loc);
  if (!s) return null;
  return s.split
    ? h('span', { class:'ship-tag split', title:'The rest of this order ships separately (from the DC or another store)' }, `Split shipment · ${s.here} of ${s.total} item${s.total === 1 ? '' : 's'}`)
    : h('span', { class:'ship-tag whole', title:'This store sends the whole order' }, 'Whole order from store');
}
async function setLine(line, patch, kind, detail) {
  await act(async () => {
    const r = await supa.from('ful_lines').update(patch).eq('id', line.id);
    if (r.error) throw r.error;
    if (kind) await logEvent(line, kind, detail);
  });
}
// Found at HQ — from the warehouse recheck or at any later stage. Asks where it was, closes the item,
// releases any store request still open, and offers the "no longer needed" email to that store.
const FOUND_REASONS = [['bin','In its bin – picker missed it'], ['wrong_bin','In the wrong bin'], ['returns','In returns / receiving, not put away'], ['other','Somewhere else']];
const FOUND_LABEL = Object.fromEntries(FOUND_REASONS);
function openFoundAtHq(line) {
  closeModal();
  const att = attemptsFor(line)[0] || null;
  const live = att && ['wait','ok','hold'].includes(att.status);
  let reason = null;
  const note = h('input', { class:'input', placeholder:'Optional note, e.g. found in bin C14', style:'width:100%' });
  const save = h('button', { class:'btn primary', disabled: true }, live ? 'Save and tell the store' : 'Save');
  const opts = h('div', { class:'pick-list', role:'radiogroup', 'aria-label':'Where was it?' }, ...FOUND_REASONS.map(([v, label]) =>
    h('label', { class:'pick' }, h('input', { type:'radio', name:'found-reason', value: v, onchange: () => { reason = v; save.disabled = false; } }), h('div', null, label))));
  save.addEventListener('click', async () => {
    closeModal();
    let released = false;
    await act(async () => {
      const now = new Date().toISOString();
      const r = await supa.from('ful_lines').update({ state:'hq_found', hq_check:'found', hq_checked_at: now, hq_found_reason: reason,
        hq_found_note: note.value.trim() || null, hq_found_qty: avail(line.sku, hqLoc()) }).eq('id', line.id);
      if (r.error) throw r.error;
      if (live) {
        const r2 = await supa.from('ful_attempts').update({ status:'released' }).eq('id', att.id);
        if (r2.error) throw r2.error;
        released = true;
      }
      await logEvent(line, 'hq_found', `Found at HQ: ${FOUND_LABEL[reason]}${note.value.trim() ? ' (' + note.value.trim() + ')' : ''}${released ? ` – ${short(att.location_name)} released` : ''}`);
    }, 'Marked as found at HQ');
    // Only bother the store if it was actually asked
    if (released && att.stock_mail_at) openReleaseDraft(att.location_name);
  });
  const bg = h('div', { class:'modal-bg', onclick: e => { if (e.target === bg) closeModal(); } },
    h('div', { class:'modal', role:'dialog', 'aria-modal':'true', 'aria-label':'Found at HQ' },
      h('div', { class:'modal-head' }, h('div', { class:'card-title' }, 'Found at HQ'), h('span', { class:'muted' }, line.order_name),
        h('button', { class:'btn sm ghost', style:'margin-left:auto', onclick: closeModal }, 'Close')),
      h('div', { class:'modal-body' },
        h('div', { class:'item-name' }, line.item_name), h('div', { class:'meta' }, `${line.sku} · HQ system shows ${avail(line.sku, hqLoc())}`),
        h('div', { class:'section-title' }, 'Where was it?'), opts, note,
        live ? h('div', { class:'banner' }, `${short(att.location_name)} was asked for this item. It will be released${att.stock_mail_at ? ', and you can send them a short “no longer needed” email' : ''}.`) : null),
      h('div', { class:'modal-foot' }, h('button', { class:'btn ghost', onclick: closeModal }, 'Cancel'), save)));
  document.getElementById('modalRoot').append(bg);
}
// Released store requests whose "no longer needed" email hasn't gone yet, grouped by store
function pendingReleases() {
  const out = {};
  for (const line of S.lines) {
    if (line.state !== 'hq_found') continue;
    const att = attemptsFor(line)[0];
    if (att && att.status === 'released' && att.stock_mail_at && !att.release_mail_at) (out[att.location_name] ||= []).push({ line, att });
  }
  return out;
}
function openReleaseDraft(locName) {
  const pairs = pendingReleases()[locName];
  if (pairs && pairs.length) openDraft('release', locName, pairs);
}

async function hqNotFound(line) {
  await act(async () => {
    const hq = avail(line.sku, hqLoc());
    let r = await supa.from('ful_lines').update({ hq_check: 'not_found', hq_checked_at: new Date().toISOString() }).eq('id', line.id);
    if (r.error) throw r.error;
    r = await supa.from('ful_hq_adjustments').insert({ sku: line.sku, item_name: line.item_name, order_name: line.order_name, line_id: line.id, hq_available: hq });
    if (r.error) throw r.error;
    await logEvent(line, 'hq_not_found', `HQ system showed ${hq}`);
  }, 'Added to HQ stock adjustments');
}

async function callSync(body) {
  const { data, error } = await supa.functions.invoke(CONFIG.SYNC_FUNCTION, { body: body || {} });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); msg = j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return data;
}

// ---------- Aramex (ACI) ----------
// Waybills are billable: only ever made from an explicit click + confirm, one order from one store per waybill.
// The function saves the waybill PDF (Aramex's own link expires in 30 minutes) for attaching to the store's email.
async function callAramex(body) {
  const { data, error } = await supa.functions.invoke(CONFIG.ARAMEX_FUNCTION, { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); msg = j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return data;
}
const hasWaybill = a => !!(a && a.waybill_number && a.waybill_number !== 'PENDING');

  { key:'flyer', label:'Flyer bag', weight:1, length:40, width:30, height:5 },

];
const SERVICE_LABEL = { PEC:'Economy (PEC)', ONP:'Overnight (ONP)', PEX:'Road express (PEX)' };
// Next working day (Mon–Sat) after 13:00, otherwise today
function defaultPickup() {
  const d = new Date();
  if (d.getHours() >= 13) d.setDate(d.getDate() + 1);
  if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  return d.toLocaleDateString('en-CA');
}
async function downloadWaybill(att, orderName) {
  if (!att.waybill_pdf) { toast('No PDF saved for this waybill'); return; }
  const { data, error } = await supa.storage.from('waybills').download(att.waybill_pdf);
  if (error) { toast('Couldn’t get the PDF: ' + error.message); return; }
  const a = h('a', { href: URL.createObjectURL(data), download: `Aramex waybill ${att.waybill_number} – ${orderName}.pdf` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function trackNow(ids) {

    await loadAll(); render();
    toast(r.tracked ? `Checked ${r.tracked} waybill${r.tracked === 1 ? '' : 's'} with Aramex${r.updated ? ` – ${r.updated} update${r.updated === 1 ? '' : 's'}` : ''}` : 'No waybills to track');

}

// ---------- email drafts ----------
function stockLine(items, loc) {
  const qs = items.map(l => avail(l.sku, loc));
  if (items.length === 1) return `Store stock says you have ${qs[0]} unit${qs[0] === 1 ? '' : 's'}.`;
  if (qs.every(q => q === 1)) return 'Store stock says you have 1 of each.';
  return 'Store stock says you have ' + items.map((l, i) => `${qs[i]} × ${l.item_name}`).join(', ') + '.';
}
function ordersPhrase(names) {
  const u = [...new Set(names)];
  if (u.length === 1) return 'Online order ' + u[0];
  return 'Online orders ' + u.slice(0, -1).join(', ') + ' & ' + u[u.length - 1];
}
function itemTable(items) {
  return '<table style="border-collapse:collapse"><tr>' + ['Order','SKU','Item','Qty'].map(t => `<th style="border:1px solid #bbb;padding:4px 8px;text-align:left">${t}</th>`).join('') + '</tr>' +
    items.map(l => '<tr>' + [l.order_name, l.sku, l.item_name, l.qty].map(v => `<td style="border:1px solid #bbb;padding:4px 8px">${esc(v)}</td>`).join('') + '</tr>').join('') + '</table>';
}
function itemText(items) { return items.map(l => `${l.order_name} | ${l.sku} | ${l.item_name} | ${l.qty}`).join('\n'); }

// Type order numbers with the short item(s) — last SKU digits, full SKU or part of the name — one order per
// line. Every order is looked up in Shopify; nothing is saved with an unknown SKU. Each ticked item gets a
// source: HQ recheck when HQ's system shows stock, otherwise the closest store with stock (changeable).
function parsePickInput(text) {
  const out = [];
  for (const raw of String(text).split(/\n|;/)) {
    const parts = raw.trim().split(/[\s,]+/).filter(Boolean);
    if (!parts.length) continue;
    const order = normOrder(parts[0]);
    if (!/^FOM\d{5,7}$/.test(order)) { out.push({ bad: raw.trim() }); continue; }
    out.push({ order, tokens: parts.slice(1).map(t => t.toLowerCase()) });
  }
  return out;
}
const tokenMatches = (li, t) => /^\d+$/.test(t) ? String(li.sku || '').endsWith(t) : String(li.name || '').toLowerCase().includes(t);

// Picking slip reader: text from a PDF (pdf.js), or OCR for a photo (Tesseract) — both load only when first used,
// and the file never leaves this browser. Returns the FOM order numbers on it, in slip order.
const loadScript = src => new Promise((ok, fail) => {
  if (document.querySelector(`script[src="${src}"]`)) return ok();
  document.head.append(h('script', { src, onload: ok, onerror: () => fail(new Error('couldn’t load the reader')) }));
});
async function ordersFromSlip(file, progress) {
  let text = '';
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    for (let p = 1; p <= pdf.numPages; p++) {
      const c = await (await pdf.getPage(p)).getTextContent();
      text += c.items.map(i => i.str).join(' ') + '\n';
      progress(Math.round(100 * p / pdf.numPages));
    }
  }
  if (!text.trim()) {   // a photo, or a scanned PDF with no text layer
    if (!file.type.startsWith('image/')) throw new Error('this PDF has no text – take a photo of the slip instead');
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const r = await Tesseract.recognize(file, 'eng', { logger: m => m.status === 'recognizing text' && progress(Math.round(m.progress * 100)) });
    text = r.data.text;
  }
  // "FOM307000", "FOM 307000", "#307000" (OCR often reads O as 0)
  const found = [...text.toUpperCase().matchAll(/(?:F[O0]M|#)\s*#?\s*(\d{6})\b/g)].map(m => 'FOM' + m[1]);
  return [...new Set(found)];
}

    return h('section', { class:'tile' }, itemBlock(line, st, { badge:`HQ shows ${avail(line.sku, hqLoc())}`, meta, extra:[where], stock: stockSummary(line) }, ...actions));
  }
  if (x.cat === 'need') {
    const sug = suggestStores(line);
    actions = [
      h('div', { class:'chips' }, sug.length ? sug.map((s, i) => isAdmin()
        ? h('button', { class:'chip' + (i === 0 ? ' best' : ''), title: s.covers ? `Can also supply ${s.covers} other item(s) on this order` : null, onclick: () => assignStore(line, s.loc.name) }, (i === 0 ? '★ ' : '') + s.loc.short_name, h('span', { class:'q' }, s.qty), s.km != null ? h('span', { class:'q' }, kmLabel(s)) : null)
        : h('span', { class:'chip static' + (i === 0 ? ' best' : '') }, s.loc.short_name, h('span', { class:'q' }, s.qty), s.km != null ? h('span', { class:'q' }, kmLabel(s)) : null))
        : h('span', { class:'note' }, 'No store has stock. Refund, or offer a swap.')),
      isAdmin() ? h('div', { class:'actions' },
        h('button', { class:'btn ghost sm', onclick: () => openFoundAtHq(line) }, 'Found at HQ'),
        h('button', { class:'btn ghost sm', onclick: () => { if (confirm(`Mark ${line.order_name} – ${line.item_name} for refund?`)) setLine(line, { state:'refund' }, 'refund', 'Marked for refund'); } }, 'Mark for refund')) : null];
    const extra = [where, st.key === 'bad' ? h('div', { class:'note' }, st.att.status === 'noreply' ? `${short(loc)} didn't reply` : `${short(loc)} had no stock`) : null];
    return h('section', { class:'tile' }, itemBlock(line, st, { meta, extra, stock: stockSummary(line) }, ...actions));
  }
  // Store categories: the email button drafts for every item at the same store in the same step
  if (canEmail() && x.cat === 'to_check') {
    const batch = items.filter(y => y.cat === 'to_check' && y.st.att.location_name === loc);
    actions.push(h('button', { class:'btn primary sm block', onclick: () => openDraft('stock', loc, batch.map(y => ({ line:y.line, att:y.st.att }))) },
      `Stock check email · ${short(loc)}${batch.length > 1 ? ` (${batch.length} items)` : ''}`));
  }
  if (x.cat === 'waiting') {
    // How long the store has been quiet, counted from the last stock check or follow-up
    const since = st.att.followup_mail_at || st.att.stock_mail_at;
    tag = h('div', { class:'waiting-for ' + (ageHours(since) >= 4 ? 'late' : '') },
      `No reply for ${ageText(since)}${st.att.followup_mail_at ? ' since the follow-up' : ''}`);
    if (canEmail()) {
      const batch = items.filter(y => y.cat === 'waiting' && y.st.att.location_name === loc);
      actions.push(h('button', { class:'btn outline sm block', onclick: () => openDraft('followup', loc, batch.map(y => ({ line:y.line, att:y.st.att }))) },
        `Follow-up email · ${short(loc)}${batch.length > 1 ? ` (${batch.length} items)` : ''}`));
      // Quiet for 4 hours or more: offer to move on to the next closest store
      if (isAdmin() && ageHours(since) >= 4) actions.push(h('button', { class:'btn outline sm block', onclick: () => moveOnFromStore(line) }, 'No reply – ask another store'));
    }
  }
  if (canEmail() && x.cat === 'to_book') {
    const batch = items.filter(y => y.cat === 'to_book' && y.st.att.location_name === loc && y.line.order_name === line.order_name);
    const pairs = batch.map(y => ({ line:y.line, att:y.st.att }));
    const n = batch.length > 1 ? ` (${batch.length} items)` : '';
    if (hasWaybill(st.att)) {
      // Waybill made: same waybill for every item of this order at this store
      const same = pairs.filter(p => p.att.waybill_number === st.att.waybill_number);
      if (isAdmin() && st.att.waybill_pdf) actions.push(h('button', { class:'btn outline sm block', onclick: () => downloadWaybill(st.att, line.order_name) }, 'Download waybill PDF'));
      if (isAdmin() && !st.att.collection_ref) actions.push(h('button', { class:'btn outline sm block', onclick: () => openWaybill(loc, same, 'collect') }, 'Book collection'));
      actions.push(h('button', { class:'btn primary sm block', onclick: () => openDraft('collect', loc, same) }, `Collection email · ${line.order_name}${n}`));
    } else if (st.att.waybill_number === 'PENDING') {
      tag = h('div', { class:'waiting-for' }, 'Waybill being created…');
    } else {
      const fresh = pairs.filter(p => !p.att.waybill_number);
      if (CONFIG.ARAMEX_ENABLED && isAdmin()) actions.push(h('button', { class:'btn gold sm block', onclick: () => openWaybill(loc, fresh) }, `Create waybill & book collection${fresh.length > 1 ? ` (${fresh.length} items)` : ''}`));
      actions.push(h('button', { class:'btn ' + (CONFIG.ARAMEX_ENABLED && isAdmin() ? 'outline' : 'primary') + ' sm block', onclick: () => openDraft('collect', loc, pairs) }, `Collection email${CONFIG.ARAMEX_ENABLED && isAdmin() ? ' only' : ''} · ${line.order_name}${n}`));
    }
  }
  if (x.cat === 'aramex') {
    // How long since the collection email (or the last collection follow-up) without a "parcel has left" reply
    const since = st.att.collect_followup_at || st.att.collect_mail_at;
    tag = h('div', { class:'waiting-for ' + (ageHours(since) >= 20 ? 'late' : '') },
      `Not confirmed collected for ${ageText(since)}${st.att.collect_followup_at ? ' since the follow-up' : ''}`);
    if (canEmail()) {
      const batch = items.filter(y => y.cat === 'aramex' && y.st.att.location_name === loc && y.line.order_name === line.order_name);
      actions.push(h('button', { class:'btn outline sm block', onclick: () => openDraft('collect_followup', loc, batch.map(y => ({ line:y.line, att:y.st.att }))) },
        `Collection follow-up · ${line.order_name}${batch.length > 1 ? ` (${batch.length} items)` : ''}`));
    }
  }
  if (x.cat === 'aramex' && isAdmin() && hasWaybill(st.att) && st.att.waybill_pdf) {
    actions.push(h('button', { class:'btn outline sm block', onclick: () => downloadWaybill(st.att, line.order_name) }, 'Download waybill PDF'));
  }
  actions.push(replyPills(line, st));
  if (isAdmin() && x.cat !== 'done') actions.push(h('button', { class:'btn ghost sm', style:'align-self:flex-start', onclick: () => openFoundAtHq(line) }, 'Found at HQ'));
  return h('section', { class:'tile' }, itemBlock(line, st, { meta, extra:[where, ship, courierTag(st.att), tag, latestNote(line.order_name)], stock: stockSummary(line, loc), mails: mailLine(st.att) }, ...actions));
}

// "Needs me today": everything waiting on the admin, most urgent first, one row per store (or store + order) with
// the button that deals with it. Store emails batch like the tile buttons do.
const TODAY_LATE_REPLY_H = 4, TODAY_LATE_COLLECT_H = 20, TODAY_LATE_RECHECK_H = 4;
function todayRows(items) {
  const rows = [];
  const pairsOf = list => list.map(y => ({ line: y.line, att: y.st.att }));
  const groupBy = (list, key) => list.reduce((m, y) => ((m[key(y)] ||= []).push(y), m), {});
  const itemsText = list => list.map(y => `${y.line.order_name} · ${y.line.item_name}`).join(' | ');
  const goTo = cat => () => { S.cat = cat; render(); document.querySelector('.section-head')?.scrollIntoView({ behavior:'smooth' }); };

  for (const y of items.filter(y => y.cat === 'need')) {
    const loc = y.st.att?.location_name;
    rows.push({ rank: 0, title: y.st.key === 'bad' ? `${y.st.att.status === 'noreply' ? 'No reply from' : 'No stock at'} ${short(loc)} – pick another store` : 'Pick a store',
      meta: itemsText([y]), btn: y.st.key === 'bad' ? ['Ask another store', () => openNextStore(y.line.id, loc, y.st.att.status === 'noreply' ? 'No reply from' : 'No stock at')] : ['Choose store', goTo('need')] });
  }
  const recheck = items.filter(y => y.cat === 'hq_check' && ageHours(y.line.added_at) >= TODAY_LATE_RECHECK_H);
  if (recheck.length) rows.push({ rank: 1, title: `Warehouse recheck waiting ${ageText(recheck.map(y => y.line.added_at).sort()[0])}`, meta: itemsText(recheck), btn: ['Open', goTo('hq_check')] });
  for (const [loc, list] of Object.entries(groupBy(items.filter(y => y.cat === 'waiting' && ageHours(y.st.att.followup_mail_at || y.st.att.stock_mail_at) >= TODAY_LATE_REPLY_H), y => y.st.att.location_name))) {
    const since = list.map(y => y.st.att.followup_mail_at || y.st.att.stock_mail_at).sort()[0];
    rows.push({ rank: 2, title: `${short(loc)} hasn't replied for ${ageText(since)}${list.some(y => y.st.att.followup_mail_at) ? ' (followed up)' : ''}`, meta: itemsText(list),
      btn: list.some(y => y.st.att.followup_mail_at) ? ['Ask another store', () => moveOnFromStore(list[0].line)] : ['Follow-up email', () => openDraft('followup', loc, pairsOf(list))] });
  }
  for (const [loc, list] of Object.entries(groupBy(items.filter(y => y.cat === 'to_check'), y => y.st.att.location_name)))
    rows.push({ rank: 3, title: `Stock check to send · ${short(loc)}`, meta: itemsText(list), btn: ['Stock check email', () => openDraft('stock', loc, pairsOf(list))] });
  for (const [, list] of Object.entries(groupBy(items.filter(y => y.cat === 'to_book'), y => y.st.att.location_name + '|' + y.line.order_name))) {
    const loc = list[0].st.att.location_name;
    rows.push({ rank: 4, title: `${short(loc)} has it – send the collection email`, meta: itemsText(list), btn: ['Collection email', () => openDraft('collect', loc, pairsOf(list))] });
  }
  for (const [, list] of Object.entries(groupBy(items.filter(y => y.cat === 'aramex' && ageHours(y.st.att.collect_followup_at || y.st.att.collect_mail_at) >= TODAY_LATE_COLLECT_H), y => y.st.att.location_name + '|' + y.line.order_name))) {
    const loc = list[0].st.att.location_name;
    rows.push({ rank: 5, title: `Not confirmed collected from ${short(loc)} for ${ageText(list[0].st.att.collect_followup_at || list[0].st.att.collect_mail_at)}`, meta: itemsText(list),
      btn: ['Collection follow-up', () => openDraft('collect_followup', loc, pairsOf(list))] });
  }
  const hold = items.filter(y => y.cat === 'hold');
  if (hold.length) rows.push({ rank: 6, title: `${hold.length} item${hold.length === 1 ? '' : 's'} on hold`, meta: itemsText(hold), btn: ['Open', goTo('hold')] });
  return rows.sort((a, b) => a.rank - b.rank);
}

// Newest order note, shown on Sourcing tiles so the admin sees what customer support added
function latestNote(name) {
  const n = ((S.notes || {})[name] || []).at(-1);
  return n ? h('div', { class:'note', title: n.author_email }, `Note (${n.author_email.split('@')[0]}, ${when(n.created_at)}): ${n.body}`) : null;

// Customer update: a short message customer support can paste into an email or chat, one line per short-picked item
function customerLine(line, st) {
  const a = st.att;
  switch (st.key) {
    case 'hq_check': return 'we’re double-checking our warehouse for it.';
    case 'new': case 'bad': return 'we’re sourcing it from one of our stores.';
    case 'wait': return 'we’re confirming stock with one of our stores.';
    case 'ok': return a.collect_mail_at || a.collection_ref
      ? 'it’s packed at one of our stores and waiting for our courier, Aramex, to collect it.'
      : 'one of our stores has it set aside, and it will be sent to you shortly.';
    case 'hold': return 'we’re looking into it and will update you shortly.';
    case 'sent': return a?.delivered_at ? 'Aramex has delivered it.'
      : `it’s on its way to you with Aramex${hasWaybill(a) ? ` (waybill ${a.waybill_number})` : ''}, separately from the rest of your order.`;
    case 'hq': return 'we found it at our warehouse and it will be sent from there.';
    case 'refund': return line.shopify_current === 0 ? 'unfortunately it’s out of stock everywhere, so we’ve refunded it.'
      : 'unfortunately it’s out of stock everywhere, so we’ll refund it.';
    default: return 'it was cancelled.';
  }
}
async function copyCustomerUpdate(name, lines, o) {
  const first = String(o.customer_name || '').trim().split(/\s+/)[0];
  const items = lines.filter(l => l.state !== 'cancelled');
  const body = items.map(l => `${items.length > 1 ? '- ' : ''}${l.item_name}: ${customerLine(l, stageOf(l))}`).join('\n');
  const text = `Hi${first ? ' ' + first : ''},\n\nThank you for your patience with order ${name}. ` +
    `Here’s an update on ${items.length > 1 ? 'the items' : 'the item'} not in your first parcel:\n\n${body}\n\nKind regards,\nThe FOM team`;
  await navigator.clipboard.writeText(text);
  toast('Customer update copied');
}

function renderLookup(main) {
  main.append(h('div', { class:'page-head' }, h('div', null, h('div', { class:'page-title' }, 'Order lookup'),
    h('div', { class:'page-sub' }, 'Search an online order to see where each short-picked item is coming from, store stock, and which emails have gone out.'))));
  const input = h('input', { class:'input', type:'search', id:'q', placeholder:'Order number, customer, SKU or item', value: S.query, 'aria-label':'Search orders',
    oninput: e => { S.query = e.target.value; drawResults(); } });
  const seg = h('div', { class:'toggle', role:'group', 'aria-label':'Show' }, ...[[false,'All'],[true,'Still open']].map(([v, l]) =>
    h('button', { 'aria-pressed': String(S.lookupOpenOnly === v), onclick: () => { S.lookupOpenOnly = v; render(); } }, l)));
  main.append(h('div', { class:'search' }, input, seg));
  const res = h('div', { class:'grid wide' });
  main.append(res);

  function drawResults() {
    const q = S.query.trim().toLowerCase();
    const qNum = q.replace(/^fom\s*/, '').replace(/^#/, '');
    const groups = {};
    for (const line of S.lines) (groups[line.order_name] ||= []).push(line);

// ---------- reports (admin) ----------
const median = xs => { const s = xs.filter(x => x != null && isFinite(x)).sort((a, b) => a - b); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : null; };
const hoursBetween = (a, b) => a && b ? (new Date(b) - new Date(a)) / 36e5 : null;
const hText = x => x == null ? '–' : x < 1 ? `${Math.max(1, Math.round(x * 60))} min` : x < 48 ? `${x.toFixed(x < 10 ? 1 : 0)} h` : `${(x / 24).toFixed(1)} days`;
const pct = (n, d) => d ? `${Math.round(100 * n / d)}%` : '–';
function mondayOf(iso) { const d = new Date(iso); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }

function storeReport() {
  const by = {};
  for (const a of S.attempts) {
    if (a.status === 'released') continue;
    const r = by[a.location_name] ||= { loc: a.location_name, asked: 0, hadIt: 0, noStock: 0, noReply: 0, waiting: 0, reply: [], collect: [] };
    r.asked++;
    if (['ok','sent'].includes(a.status)) r.hadIt++;
    else if (a.status === 'bad') r.noStock++;
    else if (a.status === 'noreply') r.noReply++;
    else if (a.status === 'wait') r.waiting++;
    if (a.stock_mail_at && a.replied_at) r.reply.push(hoursBetween(a.stock_mail_at, a.replied_at));
    if (a.collect_mail_at && a.collected_at) r.collect.push(hoursBetween(a.collect_mail_at, a.collected_at));
  }
  return Object.values(by).sort((a, b) => b.asked - a.asked || short(a.loc).localeCompare(short(b.loc)));
}
function weeklyReport(weeks = 6) {   // 6 weeks fits the 45 days of short picks the app loads
  const start = mondayOf(new Date(Date.now() - (weeks - 1) * 7 * 864e5));
  const rows = Array.from({ length: weeks }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i * 7);
    return { week: d, added: 0, hq: 0, stores: 0, refund: 0, open: 0, days: [] }; }).reverse();
  for (const l of S.lines) {
    const w = rows.find(r => new Date(l.added_at) >= r.week); if (!w) continue;
    w.added++;
    const st = stageOf(l);
    if (st.key === 'hq') w.hq++;
    else if (st.key === 'refund') w.refund++;
    else if (st.key === 'sent') { w.stores++; w.days.push(hoursBetween(l.added_at, st.att.collected_at) / 24); }
    else if (isOpenStage(st.key)) w.open++;
  }
  return rows;
}
function renderReports(main) {
  main.append(h('div', { class:'page-head' }, h('div', null, h('div', { class:'page-title' }, 'Reports'),

  main.append(h('div', { class:'section-head' }, h('div', null, h('h2', null, 'Weekly numbers'),

  const wt = h('table', { class:'plain' }, h('tr', null, ...['Week of','Short picks','Found at HQ','Sent from stores','Refunded','Still open','Short pick → collected'].map(t => h('th', null, t))));
  for (const r of weeklyReport()) wt.append(h('tr', null,
    h('td', { class:'mono' }, r.week.toLocaleDateString('en-ZA', { day:'numeric', month:'short' })),
    h('td', { class:'mono' }, String(r.added)),

    h('td', { class:'mono' }, `${r.refund} (${pct(r.refund, r.added)})`), h('td', { class:'mono' }, String(r.open)),
    h('td', { class:'mono' }, median(r.days) == null ? '–' : `${median(r.days).toFixed(1)} days`)));

  const rep = storeReport();

  const tt = h('table', { class:'plain' }, h('tr', null, ...['Store','Asked','Had it','No stock','No reply','Waiting now','Reply time','Collection time'].map(t => h('th', null, t))));
  for (const r of rep) tt.append(h('tr', null,

    h('td', { class:'mono', style: r.noStock && r.noStock / r.asked >= .3 ? 'color:var(--warn)' : null }, `${r.noStock} (${pct(r.noStock, r.asked)})`),
    h('td', { class:'mono', style: r.noReply ? 'color:var(--warn)' : null }, String(r.noReply)),

    h('td', { class:'mono' }, hText(median(r.reply))), h('td', { class:'mono' }, hText(median(r.collect)))));

  else if (S.view === 'reports' && isAdmin()) renderReports(main);
  else if (S.view === 'adjust' && isAdmin()) renderAdjust(main);
  else if (S.view === 'stores' && isAdmin()) renderStores(main);
  else renderBoard(main);
  if (hadFocus) { const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

// ---------- auth ----------
async function start(session) {
  if (!session) { document.getElementById('appView').hidden = true; document.getElementById('loginView').hidden = false; return; }
  S.userId = session.user.id; S.email = session.user.email;
  const { data: role } = await supa.rpc('ful_role');
  if (!role) {
    document.getElementById('loginView').hidden = false; document.getElementById('appView').hidden = true;
    const m = document.getElementById('loginMsg'); m.hidden = false; m.textContent = 'You’re signed in, but your account isn’t set up for fulfilment yet. Ask Musa to add you.';
    return;
  }
  S.role = role;
  if (role !== 'admin') S.view = 'lookup';
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) { S.view = 'lookup'; S.query = hash; }
  document.getElementById('whoEmail').textContent = S.email;
  document.getElementById('whoRole').textContent = role === 'admin' ? 'Admin' : 'Customer support';
  document.getElementById('loginView').hidden = true; document.getElementById('appView').hidden = false;
  try { await loadAll(); } catch (e) { console.error(e); toast('Couldn’t load: ' + e.message); }
  render();
  // Is the Aramex login set up? (no Aramex call is made — the function only checks its own secrets)
  if (role === 'admin' && CONFIG.ARAMEX_ENABLED) callAramex({ action:'status' }).then(r => { S.aramexReady = !!r.configured; render(); }).catch(() => { S.aramexReady = false; });
}
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const m = document.getElementById('loginMsg'); m.hidden = true;
  const { data, error } = await supa.auth.signInWithPassword({ email: document.getElementById('loginEmail').value.trim(), password: document.getElementById('loginPass').value });
  if (error) { m.hidden = false; m.textContent = 'Sign-in failed: ' + error.message; return; }
  start(data.session);
});
document.getElementById('signOut').addEventListener('click', async () => { await supa.auth.signOut(); location.reload(); });

// Change password: re-checks the current password first, so an unattended signed-in screen can't be used to take over the account
const MIN_PW = 8;
function openChangePassword() {
  closeModal();
  const field = (label, auto) => { const i = h('input', { class:'input', type:'password', autocomplete: auto, required: true }); return [i, h('label', { class:'pw-field' }, label, i)]; };
  const [cur, curL] = field('Current password', 'current-password');
  const [nw, nwL] = field(`New password (at least ${MIN_PW} characters)`, 'new-password');
  const [rep, repL] = field('New password again', 'new-password');
  const msg = h('div', { class:'banner err', role:'alert', hidden: true });
  const save = h('button', { class:'btn primary', type:'submit' }, 'Change password');
  const fail = t => { msg.textContent = t; msg.hidden = false; save.disabled = false; save.textContent = 'Change password'; };
  const form = h('form', { class:'modal', role:'dialog', 'aria-modal':'true', 'aria-label':'Change password', onsubmit: async e => {
    e.preventDefault();
    msg.hidden = true;
    if (nw.value.length < MIN_PW) return fail(`The new password needs at least ${MIN_PW} characters.`);
    if (nw.value !== rep.value) return fail('The two new passwords don’t match.');
    if (nw.value === cur.value) return fail('The new password is the same as the current one.');
    save.disabled = true; save.textContent = 'Saving…';
    const re = await supa.auth.signInWithPassword({ email: S.email, password: cur.value });
    if (re.error) return fail('The current password is wrong.');
    const { error } = await supa.auth.updateUser({ password: nw.value });
    if (error) return fail('Couldn’t change it: ' + error.message);
    closeModal();
    toast('Password changed');
  } },
    h('div', { class:'modal-head' }, h('div', { class:'card-title' }, 'Change password'), h('span', { class:'muted' }, S.email),
      h('button', { class:'btn sm ghost', type:'button', style:'margin-left:auto', onclick: closeModal }, 'Close')),
    h('div', { class:'modal-body' }, curL, nwL, repL, msg),
    h('div', { class:'modal-foot' }, h('button', { class:'btn ghost', type:'button', onclick: closeModal }, 'Cancel'), save));
  const bg = h('div', { class:'modal-bg', onclick: e => { if (e.target === bg) closeModal(); } }, form);
  document.getElementById('modalRoot').append(bg);
  cur.focus();
}
document.getElementById('changePw').addEventListener('click', openChangePassword);
supa.auth.getSession().then(({ data }) => start(data.session));
// Keep the board fresh while it's open
setInterval(() => {
  const busy = document.getElementById('modalRoot').children.length || S.view === 'stores' || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName) || [...document.querySelectorAll('textarea')].some(t => t.value.trim());
  if (S.role && document.visibilityState === 'visible' && !busy) act(async () => {});
}, 60000);
</script>
